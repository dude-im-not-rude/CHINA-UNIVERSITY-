name: CUCAS daily monitor

on:
  # 08:00 IST = 02:30 UTC
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: chinauni-cucas-daily
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install PDF extraction tool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: npm install --no-audit --no-fund
      - name: Discover full CUCAS university catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CUCAS_MAX_PAGES_PER_SEED: '80'
          CUCAS_MAX_DISCOVERY_PAGES: '1000'
        run: node scripts/discover-all-cucas-universities-v2.mjs
      - name: Discover and import CUCAS data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CUCAS_SEED_URLS: >-
            https://bachelor.cucas.cn/search?tag=2-137|
            https://bachelor.cucas.cn/search?tag=2-48-109-0-0-0%2C14000-0-0-1-0-0-0-0-0-0|
            https://bachelor.cucas.cn/search?tag=2-56-71-4%20or%205-0-6200%2C6600-0-0-0-2-0-0--0-0-0-0|
            https://www.cucas.cn/index/bachelorcourse?lang=en|
            https://www.cucas.cn/index/mastercourse?lang=en|
            https://www.cucas.cn/index/chinesecourse?lang=en|
            https://www.cucas.cn/index/nondegreecourse?lang=en|
            https://school.cucas.cn/|
            https://city.cucas.cn/
        run: node scripts/cucas-monitor.mjs cucas
      - name: Crawl official university programs, non-degree offerings and documents
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OFFICIAL_MAX_PAGES: '120'
          OFFICIAL_MAX_DOCS: '40'
        run: node scripts/official-program-import-v7.mjs
      - name: Enrich official contacts, locations, assets, facilities and faculty
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ENRICH_MAX_PAGES: '60'
        run: node scripts/official-university-enrichment-v4.mjs
      - name: Collect useful university intelligence
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INTEL_MAX_PAGES: '100'
        run: node scripts/official-university-intelligence-v3.mjs
      - name: Normalize duplicate program records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/dedupe-programs.mjs
      - name: Disable obvious non-program records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/clean-invalid-programs.mjs
