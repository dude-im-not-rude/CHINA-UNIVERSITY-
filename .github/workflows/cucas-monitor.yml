name: Legacy CUCAS monitor (manual only)

on:
  workflow_dispatch:

concurrency:
  group: chinauni-cucas-legacy
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Legacy CUCAS discovery/import
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/cucas-monitor.mjs cucas
      - name: Crawl official university sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/official-program-import-all.mjs
      - name: Normalize duplicate program records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/dedupe-programs.mjs
      - name: Disable obvious non-program records
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/clean-invalid-programs.mjs
