name: Official university diagnostic

on:
  push:
    paths:
      - 'scripts/official-university-monitor.mjs'
      - '.github/workflows/official-university-diagnostic.yml'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Test official university sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/official-university-monitor.mjs
